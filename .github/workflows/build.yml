name: Build and Test

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build app
        run: >
          dotnet build ShareBridge.App/ShareBridge.App.csproj
          --configuration Release
          --no-restore
          -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=false

      - name: Run tests
        run: >
          dotnet test ShareBridge.Tests/ShareBridge.Tests.csproj
          --configuration Release
          --no-restore
