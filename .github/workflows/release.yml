name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create self-signed signing certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=ShareBridgeLocal' `
            -KeyUsage DigitalSignature `
            -FriendlyName 'ShareBridge Signing Certificate' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
          "THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Export-Certificate -Cert $cert -FilePath "ShareBridge.cer" -Force | Out-Null
          Write-Host "Certificate created: $($cert.Thumbprint)"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build MSIX package
        shell: pwsh
        run: |
          $outputDir = "AppPackages\${{ matrix.platform }}"
          dotnet build ShareBridge.App/ShareBridge.App.csproj `
            --configuration Release `
            --no-restore `
            -p:Platform=${{ matrix.platform }} `
            -p:AppxPackageDir="$outputDir\" `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint="${{ steps.cert.outputs.THUMBPRINT }}"

      - name: Find and rename MSIX
        id: msix
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path "AppPackages\${{ matrix.platform }}" -Filter "*.msix" -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msix) { throw "No .msix found in AppPackages\${{ matrix.platform }}" }
          $dest = "ShareBridge_${{ matrix.platform }}.msix"
          Copy-Item $msix.FullName $dest
          "MSIX_PATH=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "MSIX: $dest"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ steps.msix.outputs.MSIX_PATH }}
          if-no-files-found: error

      - name: Upload certificate artifact (x64 only)
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: signing-cert
          path: ShareBridge.cer
          if-no-files-found: error

  upload-release-assets:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload release assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const releaseId = context.payload.release.id;
            const { owner, repo } = context.repo;

            // Collect all files to upload
            const artifactsDir = 'artifacts';
            const filesToUpload = [];
            for (const dir of fs.readdirSync(artifactsDir)) {
              const dirPath = path.join(artifactsDir, dir);
              if (fs.statSync(dirPath).isDirectory()) {
                for (const file of fs.readdirSync(dirPath)) {
                  filesToUpload.push(path.join(dirPath, file));
                }
              }
            }

            for (const filePath of filesToUpload) {
              const name = path.basename(filePath);
              const contentType = name.endsWith('.cer')
                ? 'application/x-x509-ca-cert'
                : 'application/octet-stream';

              console.log(`Uploading ${name}...`);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: releaseId,
                name,
                data,
                headers: { 'content-type': contentType },
              });
              console.log(`Uploaded ${name}`);
            }
